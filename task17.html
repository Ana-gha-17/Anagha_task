<html>
    <head>
        <title>Video Platform UI</title>
        <style>
            body
            {
                background-color: lightblue;
            }
            .container
            {
                display: flex;
                gap:20px;
                padding: 25px;    
            }
            .cont{
                background-color: blueviolet;
                width:1000px;
                height: 600px;
                border-radius: 10px;
                display:flex;
                align-items: center;
                justify-content: center;
            }
            .sidebar
            {
                display: flex;
                flex-direction: column;
                gap:20px;
            }
            .item
            {
                display: flex;
                gap:20px;
                cursor: pointer;
            }
            .view
            {
                display: flex;      
                gap:12px;
                border-bottom: 1px solid gray;
                padding: 20px;
            }
            .view button
            {
                background-color: aqua;
                border:none;
                border-radius: 20px;
                padding: 10px;
                width:90px;
                color:rgb(14, 7, 115);
                cursor: pointer;
            }
            .code 
            {
                display: flex;
                padding: 10px;
                justify-content: space-between;
                background-color: aqua;
                border-radius: 20px;
                margin-top: 10px;
                gap:20px;
            }
            .code button
            {
                border-radius: 18px;
                width:100px;
                height: 40px;
               margin-top: 30px;
               background-color:rgb(236, 233, 233);
               color: rgb(24, 24, 169);
               font-size:14px;
               cursor: pointer;
               border:none;
            }
            .menus
            {
                background-color: aqua;
                width:200px;
                height:100px;
                gap:30px;
                border-radius: 20px;
            }
            .circles
            {
                display: flex;
                gap:20px;
            }
            .circles .para
            {
                border-radius: 50px;
                background-color: rgb(149, 30, 30);
                width:40px;
                height:40px;
                margin-top: 5px;
            }
            .codes{
                display: flex;
                gap:20px;
            }
            .codes .circle
            {
                 border-radius: 50px;
                background-color: rgb(149, 30, 30);
                width:50px;
                height:50px;
                margin-top: 20px;
               
            }
            .button
            {
                color: rgb(4, 4, 88);
                font-size: 50px;
                cursor: pointer;
            }
             h2,h3
            {
                color:rgb(160, 69, 5)
            }
            p{
                color: rgb(206, 123, 13);
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="menu">
                <div class="cont">
                <div class="button">▶</div>
                </div>
                <h2>Advanced CSS Grid Tutorial</h2>
                <p>124K views 2 days ago</p>                
                <div class="view">
                    <div><button>10k</button></div>
                    <div><button>👎</button></div>
                    <div><button>Share</button></div>
                </div>
                <div class="code">          
                    <div class="codes">
                    <div class="circle"></div>
                    <div>
                    <h3>CodeMaster</h3>
                    <p>250K Subscribers</p>
                    </div>
                    </div>
                    <button>Subscribe</button>
                </div>
                <div class="comment">
                    <h2>Comments (2)</h2>
                    <div class="circles">
                    <div class="para"></div>
                     <p>Great video!</p>
                    </div>
                    <div class="circles">
                    <div class="para"></div>
                    <p>Helpful, thanks.</p>
                    </div>
                </div>
            </div>
            <div class="sidebar">
                <div class="item">
                    <div class="menus"></div>
                    <div class="content">
                        <h3>Flexbox Guide</h3>
                        <p>CodeMaster</p>
                    </div>
                </div>
                <div class="item">
                    <div class="menus"></div>
                    <div class="content">
                        <h3>React 101</h3>
                        <p>DevTips</p>
                    </div>
                </div>
                <div class="item">
                    <div class="menus"></div>
                    <div class="content">
                        <h3>CSS Vars</h3>
                        <p>StyleSheet</p>
                    </div>
                </div>
                <div class="item">
                    <div class="menus"></div>
                    <div class="content">
                        <h3>Animations</h3>
                        <p>Motion</p>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
