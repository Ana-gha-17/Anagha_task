<html>
<head>
<title>Class Based Component</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body{
background:#0f1b2d;
padding:40px;
}
.alert-box{
margin-bottom:10px;
}
</style>
</head>
<body>
<div class="container">
<div id="app"></div>
</div>
<script>
class AlertComponent{
constructor(message,color){
this.message = message
this.color = color
}
create(){
let box = document.createElement("div")
box.className = "alert alert-" + this.color + " text-white d-flex justify-content-between alert-box"
box.innerHTML = this.message + '<span>×</span>'
return box
}
}
let app = document.getElementById("app")
let alerts = [
new AlertComponent("Welcome!","danger"),
new AlertComponent("Operation Successful","primary"),
new AlertComponent("Another Info","info")
]
let boxes = []
let delay = 0
alerts.forEach(function(alert){
setTimeout(function(){
let box = alert.create()
app.appendChild(box)
boxes.push(box)
},delay)
delay += 1000
})
setTimeout(function(){
for(let i = boxes.length-1; i >= 0; i--){
setTimeout(function(){
boxes[i].remove()
},(boxes.length-1-i)*1000)
}
},3000)
</script>
</body>
</html>
