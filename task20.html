
<html>
<head>
    <title>Bootstrap Footer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        footer {
            background-color: #2f356b;
        }
        footer h5 {
            color: #6ea8fe;
        }
        footer a {
            text-decoration: none;
            color: #b8c1ec;
        }
        footer a:hover {
            color: white;
        }
        .form-control {
            background-color: #3d4278;
            border: 1px solid #555;            
        }
        .form-control::placeholder {
            color: #ccc;
        }
        .form-control:focus {
            background-color: #3d4278;
            border-color: white;
              box-shadow: none;   
            color: white;        
        }
    </style>
</head>
<body>
<footer class=" pt-5 pb-4">
    <div class="container">
        <div class="row">
            <div class="col">
                <h5>Company</h5>
                <ul class="list-unstyled">
                    <li><a href="#">About</a></li>
                    <li><a href="#">Jobs</a></li>
                </ul>
            </div>
            <div class="col-md-4 col-sm-6 mb-4">
                <h5>Resources</h5>
                <ul class="list-unstyled">
                    <li><a href="#">Blog</a></li>
                    <li><a href="#">Docs</a></li>
                </ul>
            </div>
            <div class="col-md-4">
                <h5>Stay Updated</h5>
                <form>
                    <div class="mb-3">
                        <input type="email" class="form-control" placeholder="Email">
                    </div>
                </form>
            </div>
        </div>
    </div>
</footer>
</body>
</html>
