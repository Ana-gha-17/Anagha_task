<html>
<head>
    <title>alert</title>
    <style>
        body
        {
            background-color: rgb(184, 150, 216);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        button
        {
            background-color: rgb(115, 115, 170);
            border-radius: 20px;
            width:90px;
            height: 40px;
            color: rgb(181, 22, 22);
            border: none;
        }
    </style>
</head>
<body>
<button onclick="message()">Click Me</button>
<script>
function message() 
{
    alert("Button Clicked!");
}
</script>
</body>
</html>
