<html>
    <head>
        <title>task1</title>
        <style>
            .container
            {
                display:grid;
                 grid-template-columns:repeat(3,1fr);
                  gap: 20px;
                  padding: 40px;
            }
            .container div
            {
                background-color:rgb(90, 170, 196);
                padding:20px;
                text-align: center;
                color: white;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div>1</div>
            <div>2</div>
            <div>3</div>
        </div>
    </body>
</html>
