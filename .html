<html>
<head>
<title>Simple Todo</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
     body {
            background: linear-gradient(to right, #2c2d2e, #3961a7);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    .card
    {
        width:400px;
    }
    .btn
    {
        border-radius: none;
        background-color: #536e9e;
        width:200px;
        border: none;
    }
    .btn:hover
    {
        background-color: #536e9e;
    }
</style>
</head>
<body>
<div class="card p-4 gap-3 bg-primary-subtle">
    <input type="text" id="todo" placeholder="Enter todo" class="form-control">
    <div class="text-center ">
        <button class="btn"   onclick="saveTodo()">Save</button>
    </div>
    <p>Saved:<span id="result">None</span></p>
</div>
<script>
function saveTodo() {

    let text = document.getElementById("todo").value;

    localStorage.setItem("todo", text);

    document.getElementById("result").innerText = text;
}
window.onload = function() {

    let saved = localStorage.getItem("todo");

    if(saved){
        document.getElementById("result").innerText = saved;
    }

}
</script>
</body>
</html>
