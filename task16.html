<html>
    <head>
        <title>Music Player</title>
        <style>
            body
            {
                background-color: lightblue;
            }
            .container
            {
                background-color: rgb(237, 156, 156);
                text-align: center;
                margin: 0 auto;
                width:250;
                border-radius:10px ;
                padding: 10px;
                display: grid;
                justify-content: center;
                align-items: center;
            }
            .area
            {
                background-color:blueviolet;
                height:180px;
                width:180px;
                border-radius: 10px;  

            }
            .item
            {
                display: flex;
                gap:16px;
                align-items: center;
                justify-content: center;
            }
            .item1
            {
                background-color: aqua;
                width:20px;
                border-radius: 90px;
                padding: 10px;
                
            }
            .container h2,h3
            {
                color:rgb(164, 8, 8);
            }
            .item
            {
                color:blue
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="area"></div>
            <div class="content">
                <h2>Song Title</h2>
                <h3>Artist Name</h3>
            </div>
            <div class="item">
                <div>⏮</div>
                <div class="item1">▶</div>
                <div>⏭</div>
            </div>
        </div>
    </body>
</html>
