<htm>
    <head>
        <title>E-Commerce Product Page</title>
        <style>

            body{
                margin:0;
                background-color: rgb(97, 97, 181);
            }
            .container
            {
                display:flex;
                align-items: center;
                justify-content: center;
                height:100vh;
                gap:25px;
            }
            .mainblock
            {
                display:grid;
                grid-template-columns:repeat(5,1fr) ;
                gap: 10px;
            }
            .big
            {
                grid-row: span 4;
                grid-column: span 5;
                background-color: rgb(87, 30, 141);
                width:400px;
                height: 400px;
                border-radius: 10px;
            }
            .small
            {
                background-color: rgb(185, 83, 83);
                border-radius: 10px;
                width:50px;
                height:50px;
            }
            .menu{
                width:500px;
            }
            .menu button
            {
                border-radius: 10px;
                padding:10px;
                border:none;
            }
            .menu h3{
                color:brown;
            }
            .menu h1
            {
                color:white;
            }
            .menu h2
            {
                color:blue
            }
            .menu p
            {
                color:aqua;
                font-size:20px;
            }
            .menu button{
                background-color: rgb(103, 86, 10);
                width:100px;
                height: 50px;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="mainblock">
                <div class="big"></div>
                <div class="small"></div>
                <div class="small"></div>
                <div class="small"></div>
            </div>
            <div class="menu">
                <h3>New Arrival</h3>
                <h1>Ergonomic Chair</h1>
                <h2>$299.00</h3>
                <p>Premium mesh back support for 24/7 comfort. Fully adjustable armrests and lumbar support.</p>
                <button>Add to Cart</button>
            </div>
        </div>
    </body>
</html>
