<html>
    <head>
        <title>Complex Admin Dashboard</title>
        <style>
            body
            {
                background-color: rgb(130, 124, 124);
            }
            .container
            {
                display: grid;
                grid-template-columns: 220px 1fr;
                grid-template-rows: 70px 1fr;
                grid-template-areas:
                    "sidebar header"
                    "sidebar main";
                height: 100vh;
            }
            .logo
            {
                font-size: 30px;
                color: rgb(183, 7, 98);
            }
            .sidebar
            {
                
                grid-area: sidebar;
                background-color: lightblue;
                height: 100vh;
                padding: 20px;
                width: 200px;
            }
            .item{
                color: rgb(153, 6, 6);
                padding: 10px;
                font-size:20px;
                border-radius: 10px;
                cursor: pointer;
            }
            .item:hover
            {
                background: rgb(183, 139, 85);
            }
            .top
            {
                 grid-area: header;
                display: flex;
                align-items: center;
                justify-content: space-between;
                backdrop-filter: blur(5px);
            }
            .main
            {
                display: grid;
                grid-template-columns: repeat(3,1fr);
                gap:10px;
                grid-area: main;
                padding: 20px;
            }
            .small1
            {
                background-color: lightblue; 
                border-radius: 10px;
                padding: 10px;
                width:360px;
                height:100px;
               border-top: 5px solid black;
            }
            .small2
            {
                background-color: lightblue; 
                border-radius: 10px;
                padding: 10px;
                width:360px;
                height:100px;
               border-top: 5px solid red;
            }
            .small3
            {
                background-color: lightblue; 
                border-radius: 10px;
                padding: 10px;
                width:360px;
                height:100px;
               border-top: 5px solid blue;
            }
            .big
            {
                background-color:lightblue ;
                grid-row: span 2;
                grid-column: span 2;
                border-radius: 10px;
                height:250px;
                padding: 10px;
            }
            .order
            {
                background-color:lightblue;
                border-radius: 10px;
                height: 500px;
                padding: 10px;
            }
            .menus
            {
                display:flex;
                gap:10px;
                align-items: flex-end;
                padding: 20px;
                margin-top: 50px;
                border-bottom: 1px solid black;
            }
            .menus .menu1
            {
                background-color: brown;
                height: 60px;
                width:170px;
                border-radius:  5px 5px 0 0;
            }
             .menus .menu2
            {
                background-color: brown;
                height: 90px;
                width:170px;
                border-radius: 5px 5px 0 0;
            }
             .menus .menu3
            {
                background-color: brown;
                height: 70px;
                width:170px;
                border-radius:  5px 5px 0 0;
            }
             .menus .menu4
            {
                background-color: brown;
                height: 100px;
                width:170px;
                border-radius: 5px 5px 0 0;
            }
           .contents
           {
            display: grid;
            gap:20px;
            padding: 10px;
            
           }
           .element
           {
             padding:20px;
             
           }
           .heading
           {
             border-bottom: 1px solid black;
           }
           .row
           {
             border-bottom: 1px solid black;
           }
           .header
           {
            border-radius: 10px;
            background: aqua;
           color: white;
           padding: 10px 15px;
        }
           .search
           {
            display: flex;
            background: linear-gradient(to right,pink,red);
            border-radius: 20px;
            align-items: center;
            justify-content: center;
             padding: 8px 15px;
           width: 250px;
            }
        </style>
    </head>
    <body>
    </body>
    <div class="container">
        <aside class="sidebar">
            <div class="logo">Dash</div>
            <div class="item">Overview</div>
            <div class="item">Analytics</div>
            <div class="item">Customers</div>
            <div class="item">Settings</div>
        </aside>
        <div class="top">
        <div class="header">search</div>
        <div class="search">JD</div>
        </div>
        <div class="main">
        
            <div class="small1">
                <h4>Users</h4>
                <h1>12.5k</h1>
            </div>
            <div class="small2">
                <h4>Revenue</h4>
                <h1>$45k</h1>
            </div>
            <div class="small3">
                <h4>Bounce</h4>
                <h1>24%</h1>
            </div>
          
            <div class="big">
                <h3>Traffic Overview</h3>
                <div class="menus">
                <div class="menu1"></div>
                <div class="menu2"></div>
                <div class="menu3"></div>
                <div class="menu4"></div>
                </div>
            </div>
            <div class="order">
                <h3>Recent Orders</h3>
                <div class="contents">
                <div class="heading">
                    <span class="element">ID</span>
                    <span class="element">Status</span>
                    <span class="element">Amount</span>
                </div>
                <div class="row">
                    <span class="element">#1024</span>
                    <span class="element">Paid</span>
                    <span class="element">$120</span>
                </div>
                <div class="row">
                    <span class="element">#1025</span>
                    <span class="element">Pending</span>
                    <span class="element">$85</span>
                </div>
             </div>
            </div>
        </div>
        
    </div>
</html>
