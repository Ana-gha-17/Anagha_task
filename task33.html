<html>
<head>
    <title>Random Background Color</title>
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
     <style>
        body
        {
            background-color: rgb(190, 205, 232);
        }
        .color-card
        {
            width: 600px;
            height: 300px;
            border-radius: 10px;
            transition: background-color 0.5s;
            background-color: #C1FCAD;
        }
        .btn
        {
            background-color:rgb(233, 234, 227);
            border-radius: 10px;
            cursor: pointer;
            border: none;
        }
        .btn:hover
        {
            background-color: aqua;
        }
     </style>
</head>
<body>
    <div class=" d-flex justify-content-center align-items-center vh-100  ">
        <div class="color-card d-flex justify-content-center align-items-center flex-column gap-3" id="colorcard">
            <div class="color-code" id="colorcode">#C1FCAD</div>
            <button class="btn" onclick="changeColor()">Change Background</button>
        </div>
    </div>
<script>
function changeColor() {
    const hexCharacters = "0123456789ABCDEF";
    let hexColor = "#";
    for (let i = 0; i < 6; i++) {
        hexColor += hexCharacters[Math.floor(Math.random() * 16)];
    }
    document.getElementById("colorcard").style.backgroundColor = hexColor;
    document.getElementById("colorcode").textContent= hexColor;
}
</script>

</body>
</html>
