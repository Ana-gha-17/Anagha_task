<html>
<head>
    <title>Login Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #0b132b;
        }
        .left-side {
            background: linear-gradient(135deg, #6a5acd, #17a2b8);
            color: white;
        }

        .left-content {
            height: 100vh;
        }

        .form-control {
            background-color: #415371;
            border: 1px solid #334155;
        }

        .form-control:focus {
            background-color: #415371;
            border-color:white;
            box-shadow: none;
            color: white;
        }
        .form-control::placeholder {
            color: #948d8d;
        }
        .btn-custom {
            background:rgb(71, 71, 157);
            border: none;
        }

        .btn-custom:hover {
            background: rgb(17, 111, 142);
        }

        .social-btn {
            background: #1e293b;
            border: 1px solid #334155;
            color: white;
        }
        .social-btn:hover
        {
            background: #69868b;
        }
    </style>
</head>
<body>
<div class="container p-3">
    <div class="row">
        <div class="col-lg-6  d-flex align-items-center justify-content-center left-side left-content ">
            <div class="text-center">
                <h1 class="display-4 fw-bold">Welcome Back</h1>
                <p class="lead mt-3 fw-bold">Join our community of designers and developers.</p>
            </div>
        </div>
        <div class="col-lg-6 d-flex align-items-center justify-content-center text-light">
            <div class="w-48">
                <h2 class="mb-3">Sign In</h2>
                <p class="text-secondary">Enter your details to access your account.</p>
                <form>
                    <div class="mb-3">
                        <label class="form-label">Email Address</label>
                        <input type="email" class="form-control" placeholder="anagha@company.com">
                    </div>
                    <div class="mb-3">
                        <div class="d-flex justify-content-between">
                            <label class="form-label">Password</label>
                            <a href="#" class="text-decoration-none">Forgot?</a>
                        </div>
                        <input type="password" class="form-control" placeholder="********">
                    </div>
                    <button type="submit" class="btn btn-custom w-100 text-white py-2">
                        Sign In
                    </button>
                    <div class="text-center my-4 text-secondary">OR</div>
                    <div class="d-flex justify-content-between">
                        <button class="btn social-btn w-100 me-2">G</button>
                        <button class="btn social-btn w-100 me-2">Tw</button>
                        <button class="btn social-btn w-100">Gh</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
