        body{

        h1{
            text-align: center;
            padding: 40px 0 20px;
            font-size: 40px;
            letter-spacing: 2px;
        }

        .container{ 
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 60px;
            padding: 40px 80px;
            justify-items: center;
        }

        .task-btn{
            width: 160px;
            height: 70px;
            border: none;
            border-radius: 15px;
            background: linear-gradient(to right, #8b5a00, #d2b48c);
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s ease;
        }

        .task-btn:hover {
            transform: scale(1.05);
            background: linear-gradient(to right, #5a3b00, #caa472);
        }

        .section{
            margin-bottom: 120px;
        }
