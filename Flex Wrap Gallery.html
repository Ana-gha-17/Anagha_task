<!DOCTYPE html>
<html lang="en">
<head>
  <title>Flex Wrap Gallery</title>
  <style>
   
    .container {
      display: flex;
      flex-wrap: wrap;     
      gap: 20px;
    }

    .item {
      background: #a855f7;
      height: 120px;
      flex: 1 1 200px;     
      border-radius: 8px;
    }
  .item.wide {
      flex-basis: 420px;
      gap:20px;
    }
    
  </style>
</head>

<body>

  <div class="container">
    <div class="item"></div>
    <div class="item"></div>
    <div class="item"></div>
    <div class="item"></div>
    <div class="item wide"></div>
    <div class="item wide"></div>
  </div>

</body>
</html>
