<html>
    <head>
        <title>Modern SaaS Landing</title>
        <style>
            .container
            {
                padding:20px;
            }
            body
            {
                background-color:lightblue;
            }
            .navbar
            {
                display: flex;
                justify-content: space-between;
                border-bottom: 1px solid red;
                padding: 10px;
                
            }
            .logo
            {
                font-size: 30px;
                color:blueviolet
            }
            a
            {
                text-decoration:none;
                color: blue;     
            }
            a:hover
            {
                color: blueviolet;
            }
            .nav-links 
            {
                display: flex;
                font-size:18px;
                gap:30px;
            }
            .navbar button
            {
                border-radius: 10px;
                width:70px;
                background-color: aquamarine;
                cursor: pointer;
            }
            .menus
            {
                display: flex;
                gap:150px;
                margin-top:80px;
            }
            .menu h1
            {
                color:blueviolet;
                font-size:60px;
            }
             p
            {
                font-size: 20px;
                color:blue
            }
            .menus .btn1
            {
                background-color: rgb(224, 69, 69);
                border-radius: 10px;
                padding: 10px;
                color:rgb(29, 22, 206);
                width:120px;
                border:none;
                font-weight: bold;
                cursor: pointer;
            }
            .menus .btn2
            {
                border-radius: 10px;
                padding: 10px;
                color:rgb(25, 66, 188);
                width:120px;
                background-color: lightblue;
                 font-weight: bold;
                 cursor: pointer;
            }
            .content
            {
                display: flex;
                margin-top: 200px;
                gap:20px;
            }
            .item
            {
                background-color: rgb(132, 116, 116);
                border-radius: 10px;
                width:780px;
                height: 130px;
                padding: 20px;
            }
            .item h1{
                color:rgb(1, 42, 10)
            }
            .menu1
            {
                position: relative;
                justify-content: center;
                align-items: center;
            }
            .menu2
            {
                background-color: chocolate;
                width:250px;
                height: 150px;
                top:100;
                left:100;
                position: absolute;
                border-radius: 10px;
            }
             .menu3
            {
                background-color: rgb(57, 30, 210);
                width:250px;
                height: 150px;
                top:150;
                left:180;
                position: absolute;
                border-radius: 10px;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="navbar">
                <div class="logo">SaaS.</div>
                <div class="nav-links">
                    <div><a href="#">Product</a></div>
                    <div><a href="#">Pricing</a></div>
                    <div><a href="#">About</a></div>
                </div>
                <button>Login</button>
            </div>
                <div class="menus">
                    <div class="menu">
                    <h1>Deploy faster</h1>
                    <p>The ultimate platform for modern developers to build and scale.</p>
                    <button class="btn1">Get Started</button>
                    <button class="btn2">Documentation</button>
                    </div>
                <div class="menu1">
                    <div class="menu2"></div>
                    <div class="menu3"></div>
                </div>               
            </div> 
            <div class="content">
                <div class="item">
                    <h1>Fast</h1>
                    <p>Blazing speeds.</p>
                </div>
                <div class="item">
                    <h1>Secure</h1>
                    <p>Enterprise grade.</p>
                </div>
                 <div class="item">
                    <h1>Scalable</h1>
                    <p>Grows with you.</p>
                </div>
            </div>                          
        </div>
    </body>    
</html>
