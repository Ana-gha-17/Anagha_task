<html>
    <head>
        <title>Code Editor (IDE Style)</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
        <style>
            .bg-custom
            {
                background-color: rgb(188, 161, 214);
            }
            body
           {
            margin: 0;
           }
           .col
           {
            cursor: pointer;
           }
           .col-2
           {
            cursor: pointer;
           }
           .active
           {
            background-color: rgb(161, 154, 154);
           }
           .content:hover
           {
                background-color: rgb(176, 168, 168);
           }
        </style>
    </head>
    <body>
        <div class="row g-0 vh-100 ">
            <div class="col-1 bg-primary fs-3 justify-content-between w-auto d-flex flex-column">
                <div>
                    <div>📄</div>
                    <div>🔍</div>
                    <div>🌿</div>
                </div>
                <div>
                    <div>⚙️</div>
                </div>
            </div>
            <div class="col-2 bg-custom text-white p-3">
                <div class="text-uppercase text-secondary">Explorer</div>
                <ul class="list-unstyled">
                    <li><strong>▼ PROJECT-ROOT</strong></li>
                    <li class="content">▶ src</li>
                    <li class="content">▶ components</li>
                    <li class="active"><span style="color: yellow">JS</span> App.js</li>
                    <li class="content"><span style="color: rgb(114, 81, 148);">#</span> styles.css</li>
                    <li class="content">{} package.json</li>
                </ul>
            </div>
        <div class="col d-flex flex-column">
    <div class="d-flex gap-3 bg-primary text-white ">
        <span class="bg-secondary px-2"><span style="color:yellow">js</span> App.js ×</span>
        <span><span style="color: rgb(114, 81, 148);">#</span> styles.css ×</span>
    </div>
    <div class="bg-secondary flex-grow-1">
        <pre class="p-3 m-0 text-white">
1   import React from 'react';

2   function App() {
3      return (
4         Hello World
5      );
6   }
        </pre>
    </div>

  
    <div class="bg-primary d-flex justify-content-between text-white px-3">
        <div class="d-flex gap-3">
            <div>main*</div>
            <div>0 errors</div>
        </div>
        <div class="d-flex gap-3">
            <div>Ln 5, Col 12</div>
            <div>UTF-8</div>
            <div>JavaScript</div>
        </div>
    </div>

</div>
        </div>
    </body>
</html>
