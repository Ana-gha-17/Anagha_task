<html>
    <head>
        <title>Grid Alignment Center</title>
        <style>
            .container
            {
                display:grid;
                justify-content: center; 
                align-items: center; 
                background-color: rgb(158, 77, 105);
                height: 100%;
               
            }
            .item
            {
                background-color: red;
                padding:20px;
                color:white;
            }
        </style>
    </head>
    <body>
        <div class ="container">
            <div class="item">Centered</div>
        </div>
    </body>
</html>
