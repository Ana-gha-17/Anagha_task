<html>
    <head>
        <title>Simple Calculator</title>
        <style>
            body
            {
                background-color:rgb(147, 147, 197);
                display: flex;
                align-items: center;
                justify-content: center;
            }
            .container
            {
                display: flex;
                align-items: center;
                gap:20px;
            }
            input
            {
                width:150px;
                height: 40px;
                border-radius: 10px;
                border: none;
                background-color:burlywood;
                color: brown;    
            }
            input:focus
            {
                outline: none;
            }
            button
            { 
                width:50px;
                height: 30px;
                border-radius: 10px;
                border: none;
                background-color:burlywood;
                color: brown;
                font-size: 20px;
                cursor: pointer;
            }
            
            p
            {
                color:brown;
                font-size: 30px;
                font-weight: bold;
            }
            span
            {
                color: brown;
                font-size: 25px;
                font-weight: bold;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <input type="number" id="n1" placeholder="0">
            <span>+</span>
            <input type="number" id="n2" placeholder="0">
            <button onclick="sum()">=</button>
            <p id="sample">0</p>
        </div>
        <script>
            function sum()
            {
              let a=Number(document.getElementById("n1").value);
              let b=Number(document.getElementById("n2").value);
              let sum=a+b;
              document.getElementById("sample").innerHTML=sum;
            }
        </script>
    </body>
</html>
