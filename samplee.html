<html>
    <head>
        <title>Multi-Col Footer</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
        <style>
            footer {
            background-color: #2f356b;
        }
        footer h5 {
            color: #6ea8fe;
        }
        footer a {
            text-decoration: none;
            color: #b8c1ec;
        }
        
        .form-control {
            background-color: #3d4278;
            border: none;
            
        }
        input:focus {
    border-color:white;
    outline: none;   /* removes default browser outline */
}
        
        </style>
    </head>
    <body>
        <footer class="pt-5 pb-4">
        <div class="container">
            <div class="row">
                <div class="col-md-4  col-sm-6 mb-4">
                    <h5>Company</h5>
                    <ul class="list-unstyled">
                        <li><a href="#">About</a></li>
                        <li><a href="#">Jobs</a></li>
                    </ul>
                </div>
                <div class="col-md-4  col-sm-6 mb-4">
                    <h5>Resources</h5>
                    <ul class="list-unstyled">
                        <li><a href="#">Blog</a></li>
                        <li><a href="#">Docs</a></li>
                    </ul>
                </div>
                <div class="col-md-4  col-sm-6 mb-4">
                    <h5>Stay Updated</h5>
                     <form>
                        <div class="mb-3">
                            <input type="email" class="form-control" placeholder="Email">
                        </div>
                    </form>
                </div>
            </div>
        </div>
        </footer>
    </body>

</html>
