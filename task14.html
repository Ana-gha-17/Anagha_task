<html>
  <head>
    <title>Admin Dashboard</title>
    <style>
      body
      {
        background-color: blueviolet;
       
      }
      .container
      {
        display: flex;
        padding: 20px;
        gap:25px;
      }
      .logo
      {
        font-size: 30px;
        color: rgb(222, 112, 112);
        
      }
      .item{
        color: rgb(99, 91, 91);
        padding: 10px;
        font-size:20px;
        border-radius: 10px;
        cursor: pointer;
      }
      .item active,.item:hover
      {
        background: rgb(169, 158, 158);
        color:white;
      }
      
      .Dash
      {
        background-color: rgb(0, 162, 255);
        height: 100vh;
        padding: 20px;
        width: 250px;
      }

     .navbar
     {
        display: flex;
        color:white;
        font-size: 20px;
        padding:20px;
     }
     .main
     {
      display:grid;
      grid-template-columns: repeat(3,1fr);
      gap:20px;
     }
     .big
     {
      grid-row: span 3;
      grid-column: span 3;
      background-color: rgb(0, 162, 255);
      border-radius: 10px;
      padding: 10px;
      width:900px;
      height: 500px;
     }
     .small
     {
      background-color:rgb(0, 162, 255);
      border-radius: 10px;
      padding: 10px;
     }
     .small h2
     {
      color:rgb(112, 97, 97)
     }
     .small{
      color:white;
     }
     .big h1
     {
      color:white;
     }
     .big h3{
      color:rgb(116, 108, 108);
     }
    </style>
  </head>
  <body>
    <div class="container">
      
      <aside class="Dash">
        <div class="logo">Dash</div>
        <div class="item">Overview</div>
        <div class="item">Users</div>
        <div class="item">Settings</div>
      </aside>
      
      <div class="Dashboard">
      <div class="navbar">Dashboard Overview</div>
      <div class="main">
                <div class="small">
                  <h2>Total Users</h2>
                  <h1>1,234</h1>
                </div>
                <div class="small">
                  <h2>Revenue</h2>
                  <h1>$45k</h1>
                </div>
                <div class="small">
                  <h2>Active</h2>
                  <h1>89%</h1>
                </div>
                <div class="big">
                  <h1>Recent Activity</h1>
                  <h3>User A signed up</h3>
                  <h3>New order #1234</h3>
                </div>
      <div>
      </div>
    </div>
  </body>
</html>
