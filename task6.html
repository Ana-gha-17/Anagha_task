<html>
    <head>
        <title>grid template area</template></title>
        <style>
            .container
            {
                display:grid;
                grid-template-columns:200px auto;
                grid-template-rows: 70px 580px auto;
                grid-template-areas:"header header"
                "sidebar content" "footer footer";
                padding:20px;
                font-size: 20px;
            }
            .header
            {
                grid-area:header;
                background-color: blueviolet;
                padding:20px;
            }
            .sidebar
            {
                grid-area:sidebar;
                background-color: rgb(83, 78, 78);
                padding:20px;
            }
            .content
            {
                grid-area:content;
                background-color: gray;
                padding:20px;
            }
            .footer
            {
                grid-area:footer;
                background-color:rgb(145, 57, 57);
                padding:20px;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <header class="header">Header</header>
            <sidebar class="sidebar">Sidebar</sidebar>
            <content class="content">Content</content>
            <footer class="footer">Footer</footer>
        </div>

    </body>
</html>
