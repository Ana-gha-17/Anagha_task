<html>
<head>
    <title>Image Gallery</title>
    <style>
        body
        {
            background-color: blanchedalmond;         
        }
        img 
        {
            width: 250px;
            height: 270px;
            border-radius: 10px;            
        }
        .container
        {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap:30px;
            margin-top: 50px;
        }      
        button
        {
            border-radius: 20px;
            background-color: rgb(226, 129, 198);
            border: none;
            width:90px;
            height: 40px;
            cursor: pointer;
            color: white;
            transition: all 0.3s;
        }
        button:hover
        {
            background-color: rgb(159, 88, 225);
        }
        button.active
        {  
            background-color: rgb(159, 88, 225);
        }
        .item
        {
           display: flex;
           flex-wrap: wrap;   
           gap: 20px;  
           margin-left: 5%;    
        }
    </style>
</head>
<body>
<div class="container">
    <div class="content">
        <button  class="active" onclick="filterImages('all',this)">All</button>
        <button onclick="filterImages('bangles',this)">Bangles</button>
        <button onclick="filterImages('dress',this)">Dress</button>
        <button onclick="filterImages('earings',this)">Earings</button>
    </div>
    <div class="item">
       <div><img src="bangle.jpg" class="bangles"></div>
       <div><img src="dress1.jpg" class="dress"></div>
       <div><img src="dress2.jpg" class="dress"></div>       
       <div> <img src="earings1.jpg" class="earings"></div>
       <div> <img src="earings2.jpg" class="earings"></div>
       <div> <img src="dress3.jpg" class="dress"></div>
       <div> <img src="bangles.jpg" class="bangles"></div>
       <div> <img src="earings3.jpg" class="earings"></div>
    </div>
</div>
<script>
function filterImages(category, buttonClicked) {
    let image = document.getElementsByTagName("img");
    for (let i = 0; i < image.length; i++) {
        if (category == "all") {
            image[i].style.display = "inline";
        }
        else if (image[i].className == category) {
            image[i].style.display = "inline";
        }
        else {
            image[i].style.display = "none";
        }
    }
    let buttons = document.getElementsByTagName("button");
    for (let i = 0; i < buttons.length; i++) {
        buttons[i].classList.remove("active");
    }
    buttonClicked.classList.add("active");
}
</script>
</body>
</html>
