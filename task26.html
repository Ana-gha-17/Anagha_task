<html>
<head>
    <title>Monthly Calendar App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style> 
    body{
        margin: 0;
    }
    .bg-custom
    {
        background-color: rgb(176, 170, 170);
    }
    .d-flex
    {
        cursor: pointer;
    }
    .mt-3
    {
        cursor: pointer;
    }
    .content 
    {
    height:120px;
    position: relative;
 
    }
   .event {
    position: absolute;
    width: 150px;
    font-size: 13px;
    padding: 2px 6px;
    border-radius: 5px;
    color: white;
    cursor: pointer;
    
   }

   .event-fam {
    position: absolute;
    width: 350px;
    font-size: 13px;
    padding: 2px 6px;
    border-radius: 5px;
    color: white;
    cursor: pointer;
    
   }
   .btn
   {
    border: none;
   }
   .day-circle {
    width: 28px;
    height: 28px;
    line-height: 28px;
    text-align: center;
    border-radius: 50%;
}
    </style>
</head>
<body class="m-0">
    <div class="container-fluid ">
    <div class="row  ">
        <div class="col-1 w-auto vh-100 border border-2">
            <h4>October 2023</h4>
                <div class="d-flex w-auto gap-3 mb-2 justify-content-between">
                    <span>S</span>
                    <span>M</span>
                    <span>T</span>
                    <span>W</span>
                    <span>T</span>
                    <span>F</span>
                    <span>S</span>
                </div>
                <div class="d-flex gap-3 mb-2 justify-content-between">
                    <span>29</span>
                    <span>30</span>
                    <span>1</span>
                    <span>2</span>
                    <span>3</span>
                    <span>4</span>
                    <span>5</span>
                </div>
                <div class="d-flex gap-3 mb-2 justify-content-between">
                    <span>6</span>
                    <span>7</span>
                    <span>8</span>
                    <span class="bg-primary text-white rounded-circle px-2 ">9</span>
                    <span>10</span>
                    <span>11</span>
                    <span>12</span>
                </div>
                 <div class="d-flex gap-3 mb-2 justify-content-between">
                    <span>13</span>
                    <span>14</span>
                    <span>15</span>
                    <span>16</span>
                    <span>17</span>
                    <span>18</span>
                    <span>19</span>
                </div>
           
            <div><h5>My Calendars</h5></div>
            
            <div class="mt-3">
                <div><span class="badge  bg-primary me-2">&nbsp;</span> Personal</div>
                <div><span class="badge bg-success me-2">&nbsp;</span> Work</div>
                <div><span class="badge bg-warning me-2">&nbsp;</span> Family</div>
            </div>

            </div>
        <div class="col border-start">
          
            <div class="d-flex">
                <div><h4>October 2023</h4></div>
                <button class="btn">&lt;</button>
                <button class="btn">&gt;</button>
            </div>
            
         <div class="row row-cols-7 ">
            <div class="col text-center fw-bold border p-2 ">SUN</div>
            <div class="col text-center fw-bold border p-2">MON</div>
            <div class="col text-center fw-bold border p-2">TUE</div>
            <div class="col text-center fw-bold border p-2">WED</div>
            <div class="col text-center fw-bold border p-2">THU</div>
            <div class="col text-center fw-bold border p-2">FRI</div>
            <div class="col text-center fw-bold border p-2">SAT</div>
         </div>
         <div class="row row-cols-7 ">
            <div class="col  content border bg-custom"><div>29</div></div>
            <div class="col content border bg-custom"><div>30</div></div>
            <div class="col content border "><div>1</div></div>
            <div class="col content border "><div>2</div></div>
            <div class="col content border "><div>3</div></div>
            <div class="col content border "><div>4</div></div>
            <div class="col content border "><div>5</div></div>
         </div>
         <div class="row row-cols-7 ">
            <div class="col content border "><div>6</div></div>
            <div class="col  content border "><div>7</div></div>
            <div class="col content border "><div>8</div>
            <div class="event bg-primary">Dentist 10am</div>
            </div>
            <div class="col content border bg-secondary"><div class="bg-primary px-1 day-circle ">9</div></div>
            <div class="col content border"><div>10</div></div>
            <div class="col  content border"><div>11</div>
            <div class="event bg-success">Team Sync</div>
            </div>
            <div class="col content border"><div>12</div></div>
         </div>
         <div class="row row-cols-7 ">
            <div class="col content border "><div>13</div></div>
            <div class="col content border"><div>14</div></div>
            <div class="col content border"><div>15</div></div>
            <div class="col content border"><div>16</div></div>
            <div class="col content border"><div>17</div></div>
            <div class="col content border"><div>18</div></div>
            <div class="col  content border"><div>19</div></div>
         </div>
         <div class="row row-cols-7 ">
            <div class="col content border ">20
            <div class="event-fam bg-success">Team Sync</div>
            </div>
            <div class="col content border"><div>21</div></div>
            <div class="col content border"><div>22</div></div>
            <div class="col content border"><div>23</div></div>
            <div class="col content border"><div>24</div></div>
            <div class="col content border"><div>25</div>
            <div class="event bg-primary ">Pay Bills</div>
            </div>
            <div class="col content border"><div>26</div></div>
         </div>   
    </div>
    </div>
    </div>
</body>
</html>
